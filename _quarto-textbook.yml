# Textbook-only profile: `quarto render --profile textbook`. Used for
#   - the public copy on daveparr.com/geographic-information-science/
#     (.github/workflows/publish.yml, HTML), and
#   - the PDF textbook (`quarto render --to PrettyPDF-pdf --profile textbook`).
# It leaves out the course pages (Welcome, Syllabus, Course resources, About)
# and the top menu, which live only on geog370.org, and it leaves out every
# quiz: the chapter quizzes and the unit quizzes. Quizzes are only on
# geog370.org (_quarto-site.yml). Links to quiz pages on the unit pages and in
# the Preface are wrapped in `content-hidden when-profile="textbook"` so they
# disappear here too.
#
# A book must start at index.qmd. With this profile index.qmd shows the
# Preface instead of the Welcome page (see the top of index.qmd).
project:
  render:
    - index.qmd
    - units/*.qmd
    - chapters/*.qmd
    # No quiz pages, not even as unlisted pages.
    - "!units/*-quiz.qmd"
    - "!chapters/*-quiz.qmd"
    - glossary.qmd
    - references.qmd

book:
  chapters:
    - index.qmd
    - part: units/unit-1.qmd
      chapters:
        - chapters/what-is-gis.qmd
        - chapters/what-is-geographic-data.qmd
        - chapters/location-and-coordinates.qmd
        - chapters/map-projections.qmd
    - part: units/unit-2.qmd
      chapters:
        - chapters/attribute-queries.qmd
        - chapters/database-joins.qmd
        - chapters/spatial-joins.qmd
        - chapters/data-classing.qmd
    - part: units/unit-3.qmd
      chapters:
        - chapters/census-data.qmd
        - chapters/federal-data.qmd
        - chapters/osm-data-quality.qmd
        - chapters/uncertainty.qmd
        - chapters/digital-elevation-models.qmd
    - part: units/unit-4.qmd
      chapters:
        - chapters/spatial-analysis.qmd
        - chapters/geocoding-georeferencing.qmd
        - chapters/density.qmd
        - chapters/raster.qmd
    - part: units/unit-5.qmd
      chapters:
        - chapters/interpolation.qmd
        - chapters/kriging.qmd
        - chapters/suitability-modeling.qmd
        - chapters/risk-analysis.qmd
    - part: "GIS Software"
      chapters:
        - chapters/qgis.qmd
        - chapters/arcgis-pro.qmd
    - part: "Looking Ahead"
      chapters:
        - chapters/whats-next.qmd
    # Units and chapters go here, in the same order as _quarto-site.yml but
    # without the quiz pages. For example:
    #
    # - part: units/unit-1.qmd
    #   chapters:
    #     - chapters/what-is-gis.qmd
  appendices:
    - glossary.qmd
    - about.qmd
    - references.qmd
