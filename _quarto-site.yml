# Full site (default profile): course pages, top menu, and the textbook.
# Used for geog370.org (`--profile geog370` turns this on too).
book:
  # Top menu on every page. Welcome, Syllabus, About, Student services
  # (sidebar only), and Privacy policy (sidebar and
  # footer only) are public on geog370.org; every other page asks students to
  # sign in (see PUBLIC_PAGES in assets/auth-gate.html).
  navbar:
    left:
      - href: index.qmd
        text: Welcome
      - href: syllabus.qmd
        text: Syllabus
      - href: materials.qmd
        text: Course resources
      - href: about.qmd
        text: About
      - href: preface.qmd
        text: Textbook

  chapters:
    - part: "Course"
      chapters:
        - index.qmd
        - syllabus.qmd
        - materials.qmd
        - about.qmd
        - privacy.qmd
        - student-services.qmd
    - preface.qmd
    - part: units/unit-1.qmd
      chapters:
        - chapters/what-is-gis.qmd
        - chapters/what-is-gis-quiz.qmd
        - chapters/what-is-geographic-data.qmd
        - chapters/what-is-geographic-data-quiz.qmd
        - chapters/location-and-coordinates.qmd
        - chapters/location-and-coordinates-quiz.qmd
        - chapters/map-projections.qmd
        - chapters/map-projections-quiz.qmd
        - units/unit-1-quiz.qmd
    - part: units/unit-2.qmd
      chapters:
        - chapters/attribute-queries.qmd
        - chapters/attribute-queries-quiz.qmd
        - chapters/database-joins.qmd
        - chapters/database-joins-quiz.qmd
        - chapters/spatial-joins.qmd
        - chapters/spatial-joins-quiz.qmd
        - chapters/data-classing.qmd
        - chapters/data-classing-quiz.qmd
        - units/unit-2-quiz.qmd
    - part: units/unit-3.qmd
      chapters:
        - chapters/census-data.qmd
        - chapters/census-data-quiz.qmd
        - chapters/federal-data.qmd
        - chapters/federal-data-quiz.qmd
        - chapters/osm-data-quality.qmd
        - chapters/osm-data-quality-quiz.qmd
        - chapters/uncertainty.qmd
        - chapters/uncertainty-quiz.qmd
        - chapters/digital-elevation-models.qmd
        - chapters/digital-elevation-models-quiz.qmd
        - units/unit-3-quiz.qmd
    - part: units/unit-4.qmd
      chapters:
        - chapters/spatial-analysis.qmd
        - chapters/spatial-analysis-quiz.qmd
        - chapters/geocoding-georeferencing.qmd
        - chapters/geocoding-georeferencing-quiz.qmd
        - chapters/density.qmd
        - chapters/density-quiz.qmd
        - chapters/raster.qmd
        - chapters/raster-quiz.qmd
        - units/unit-4-quiz.qmd
    - part: units/unit-5.qmd
      chapters:
        - chapters/interpolation.qmd
        - chapters/interpolation-quiz.qmd
        - chapters/kriging.qmd
        - chapters/kriging-quiz.qmd
        - chapters/suitability-modeling.qmd
        - chapters/suitability-modeling-quiz.qmd
        - chapters/risk-analysis.qmd
        - chapters/risk-analysis-quiz.qmd
        - units/unit-5-quiz.qmd
    - part: "GIS Software"
      chapters:
        - chapters/qgis.qmd
        - chapters/arcgis-pro.qmd
    - part: "Looking Ahead"
      chapters:
        - chapters/whats-next.qmd
    # Units and chapters go here, each chapter followed by its (unnumbered)
    # chapter quiz page, and each unit ending with its unit quiz. Add the
    # same unit and chapter (without the quiz pages) to _quarto-textbook.yml.
    # Templates for each page are in _templates/. For example:
    #
    # - part: units/unit-1.qmd
    #   chapters:
    #     - chapters/what-is-gis.qmd
    #     - chapters/what-is-gis-quiz.qmd
    #     - units/unit-1-quiz.qmd
  appendices:
    - glossary.qmd
    - references.qmd
