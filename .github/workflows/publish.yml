name: Render and Publish Quarto Book

# Every push to main renders the textbook (unit pages, chapters, glossary; not
# the course pages, and no quizzes, which are only on geog370.org) with the
# `textbook` profile (_quarto-textbook.yml) and commits it to
# dparr1/daveparr.com under geographic-information-science/, which triggers Cloudflare's build of
# daveparr.com (https://daveparr.com/geographic-information-science/).
#
# The gated copy for https://geog370.org is NOT built here: Cloudflare Workers
# Builds, connected to this repo, renders and deploys it on the same push
# (see wrangler.jsonc and scripts/cloudflare-build.sh).
#
# It also renders the PDF textbook (PrettyPDF, `textbook` profile) and
# publishes it as an asset of this repo's `textbook-pdf` GitHub release:
#   https://github.com/dparr1/geog-370-geographic-information-science/releases/download/textbook-pdf/Geographic-Information-Science.pdf
# The PDF is over Cloudflare's 25 MiB per-file limit, so it is NOT copied
# into daveparr.com; the book's "Download PDF" links are rewritten to point
# at the release instead (here, and for geog370.org in
# scripts/cloudflare-build.sh). The PDF needs LaTeX (TinyTeX); the book has
# no R or other executable code. If the PDF fails, the HTML is still
# published and the release keeps the previous PDF.

on:
  push:
    branches: [ main ]
  # Pull requests only test the build: the HTML and PDF are rendered and the
  # PDF is attached to the run (Summary > Artifacts), but nothing is published.
  pull_request:
  workflow_dispatch:

permissions:
  # write: to create/update the `textbook-pdf` release.
  contents: write

concurrency:
  group: publish-book-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PDF_NAME: Geographic-Information-Science.pdf
      PDF_URL: https://github.com/${{ github.repository }}/releases/download/textbook-pdf/Geographic-Information-Science.pdf
    steps:
      - name: Check out book
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Rendered before the HTML because rendering the HTML book empties _book/.
      # Quarto installs any missing LaTeX packages into TinyTeX as it goes.
      - name: Render PDF textbook
        id: pdf
        continue-on-error: true
        run: |
          quarto render --to PrettyPDF-pdf --profile textbook
          mkdir -p "${RUNNER_TEMP}/pdf"
          mv _book/Geographic-Information-Science.pdf "${RUNNER_TEMP}/pdf/"

      # daveparr.com/geographic-information-science/ gets the textbook only (no Welcome, Syllabus,
      # Course materials, or About pages; those are on geog370.org). A book
      # must start at index.qmd, so the Preface becomes the home page here.
      - name: Render textbook only
        run: |
          cp preface.qmd index.qmd
          quarto render --to html --profile textbook

      # The PDF lives on GitHub (it's too big for Cloudflare), so point every
      # "Download PDF" link (./, ../, ../../ or bare) at the release asset.
      - name: Point PDF links at the GitHub release
        run: |
          find _book -name '*.html' -print0 | xargs -0 sed -E -i \
            "s#href=\"(\.\.?/)*${PDF_NAME//./\\.}\"#href=\"${PDF_URL}\"#g"
          if grep -rlE "href=\"(\.\.?/)*${PDF_NAME//./\\.}\"" _book --include='*.html'; then
            echo "::error::Some PDF links were not rewritten."; exit 1
          fi

      - name: Publish the PDF as a GitHub release asset
        if: github.event_name != 'pull_request' && steps.pdf.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view textbook-pdf >/dev/null 2>&1; then
            gh release create textbook-pdf --target "${GITHUB_SHA}" \
              --title "Geographic Information Science (PDF textbook)" \
              --notes "The PDF edition of the open textbook *Geographic Information Science* (GEOG 370), rebuilt on every push to main. Download: ${PDF_URL} . Read online: https://daveparr.com/geographic-information-science/"
          fi
          gh release upload textbook-pdf "${RUNNER_TEMP}/pdf/${PDF_NAME}" --clobber

      - name: Warn when the PDF didn't build
        if: github.event_name != 'pull_request' && steps.pdf.outcome != 'success'
        run: echo "::warning::PDF render failed; the release keeps the previous PDF."

      - name: Attach the PDF to this run
        if: github.event_name == 'pull_request' && steps.pdf.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: ${{ runner.temp }}/pdf/Geographic-Information-Science.pdf

      - name: Fail a pull request whose PDF didn't build
        if: github.event_name == 'pull_request' && steps.pdf.outcome != 'success'
        run: |
          echo "::error::The PDF textbook failed to render. See the 'Render PDF textbook' step."
          exit 1

      - name: Check out daveparr.com
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: dparr1/daveparr.com
          ref: main
          path: daveparr.com
          # Deploy key with write access to daveparr.com (repo Settings >
          # Deploy keys); its private half is this repo's secret.
          ssh-key: ${{ secrets.DAVEPARR_DEPLOY_KEY }}

      - name: Copy book into daveparr.com/geographic-information-science
        if: github.event_name != 'pull_request'
        run: |
          # _book/ has no PDF, so --delete also removes any old copy there.
          rsync -a --delete _book/ daveparr.com/geographic-information-science/
          cd daveparr.com
          git add -A geographic-information-science
          if git diff --cached --quiet; then
            echo "Book unchanged on daveparr.com; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GEOG 370 book from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main

