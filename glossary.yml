# Glossary of key terms for the book.
#
# This one file drives two things:
#   1. Hover/tap definitions in the chapters. The glossary filter
#      (filters/glossary/glossary.lua) finds each term in the chapter text and
#      turns it into a dotted-underlined word that shows its definition when
#      hovered, tapped, or focused with the keyboard. To keep pages readable,
#      only the FIRST use of a term in each section (each ## heading) is marked.
#   2. The Glossary page at the back of the book (glossary.qmd), which lists
#      every term alphabetically.
#
# Each entry has:
#   term:            The name shown in the popup and on the Glossary page. It is
#                    also matched in the text (case doesn't matter).
#   aliases:         (optional) Other spellings to match: plurals, abbreviations,
#                    other forms of the word.
#   definition:      One or two plain sentences. Markdown (*italic*, `code`) works.
#   case_sensitive:  (optional) true to match only the exact capitalization, for
#                    words that are also ordinary English (Console, Editor).
#   chapters:        (optional) Limit matching to these chapter files (file name
#                    without .qmd), for words that mean different things in
#                    different chapters ("block" of code vs. census "block").
#
# Matching is on whole words, and the longest match wins, so "block group" is
# never marked as "block", and "R Markdown" is never marked as "Markdown".

# Phrases that look like a term but aren't one. They are matched (so the
# shorter term inside them is not) and left unmarked.
exclude: ["GIS Day", "GIS Certification Institute", "GRASS GIS", "Quantum GIS", "Learn ArcGIS", "Open Geospatial Consortium", "Switch from Shapefile"]

# Add terms as the chapters are written. For example:
#
#   - term: Datum
#     aliases: [datums, geodetic datum]
#     definition: A model of Earth's shape and position that coordinates are measured from, such as NAD83 or WGS84.
#
#   - term: Raster
#     aliases: [rasters, raster data]
#     definition: A grid of cells, each holding a value, used to represent continuous surfaces such as elevation.
terms:

  # --- Chapter 1: What Is GIS? -----------------------------------------------

  - term: geographic information system (GIS)
    aliases: [GIS, GISystem, GISystems, geographic information system, geographic information systems]
    definition: >-
      "A computer-based system to aid in the collection, maintenance,
      storage, analysis, output, and distribution of spatial data and
      information" (Bolstad). Its five components are data, hardware,
      software, people, and procedures.

  - term: geographic information science (GIScience)
    aliases: [GIScience, GISci, geographic information science, geographical information science]
    definition: >-
      The theory and methods behind GIS: research on analysis, data
      representation, visualization, and GIS and society. Michael Goodchild
      named the field in 1992.

  - term: spatial data
    aliases: [geographic data, geospatial data, geographic information, spatial information]
    definition: >-
      Data tied to a location on or near Earth, such as the address of a
      house, the outline of a county, or the elevation at a point.

  - term: geospatial
    definition: >-
      A common synonym for *geographic*, used especially in industry,
      the military, and government.

  - term: geographic problem
    aliases: [geographic problems]
    definition: >-
      A problem that happens in specific places at specific times. It can
      be described by its scale, time, space, and purpose.

  - term: GIS question
    aliases: [GIS questions]
    definition: >-
      A question whose answer depends on location, such as where something
      clusters, how places differ, what factors explain a pattern, how a
      place has changed, or how accessible a service is.

  - term: spatial analysis
    definition: >-
      Methods that use the locations of things, and the relationships among
      them, to find patterns, explain them, or make predictions.

  - term: overlay analysis
    aliases: [overlay, map overlay]
    definition: >-
      Stacking layers of data for the same area to find places that meet
      several conditions at once, such as flat land near a road and outside
      a floodplain.

  - term: layer
    aliases: [layers, thematic layer, thematic layers]
    definition: >-
      A set of spatial data about one theme, such as roads, soils, or
      elevation. Layers for the same area stack on top of each other to
      make a map.

  - term: attribute
    aliases: [attributes, attribute table, attribute tables, attribute data]
    definition: >-
      A non-spatial fact about a feature, such as a building's name or the
      year it was built. Attributes are stored in a table with one row per
      feature.

  - term: metadata
    definition: >-
      Data about data: who made a dataset, when, how, in what coordinate
      system, and how accurate it is.

  - term: data model
    aliases: [data models]
    definition: >-
      The way a GIS represents the real world as data, for example as
      points, lines, and polygons (vector) or as a grid of cells (raster).

  - term: coordinate system
    aliases: [coordinate systems, coordinates]
    definition: >-
      A system of numbers, such as latitude and longitude, that gives
      every location a unique position so layers line up with each other.

  - term: map projection
    aliases: [map projections, projection, projections]
    definition: >-
      A mathematical method for flattening the round Earth onto a flat map.
      Every projection distorts area, shape, distance, or direction in some
      way.

  - term: remote sensing
    definition: >-
      Collecting information about Earth without touching it, from sensors
      on satellites, aircraft, or drones.

  - term: radar
    chapters: [what-is-gis]
    definition: >-
      A remote sensing method in which a satellite or aircraft sends out its
      own microwave signal and records what bounces back. It sees through
      clouds and smoke, and works at night.

  - term: change detection
    definition: >-
      Comparing images or maps of the same place from different dates to
      find what changed.

  - term: network
    aliases: [networks]
    chapters: [what-is-gis]
    definition: >-
      Connected lines and intersections, such as roads, rails, rivers, or
      pipes, with a cost such as length or travel time on each segment.

  - term: network analysis
    definition: >-
      Analysis of movement along a network, such as roads, to find routes
      and measure travel distance or time.

  - term: route optimization
    definition: >-
      Finding the best path through a network, such as the fastest or
      shortest route, or a delivery route that visits many stops.

  - term: site selection
    definition: >-
      Using GIS to choose the best location for something, such as a new
      store, clinic, or fire station.

  - term: cluster
    aliases: [clusters]
    chapters: [what-is-gis]
    definition: >-
      A group of events or features that are closer together than you
      would expect by chance, such as cases of a disease around one place.

  - term: accessibility
    chapters: [what-is-gis]
    definition: >-
      How easily people can reach a place or service, often measured as
      distance or travel time.

  - term: population density
    definition: >-
      The number of people per unit of area, such as people per square
      mile.

  - term: epidemiology
    definition: >-
      The study of how diseases are distributed and spread in populations.
      John Snow's 1854 cholera map is a founding example.

  - term: cartography
    definition: >-
      The art and science of making maps.

  - term: CAD
    case_sensitive: true
    aliases: [computer-aided design]
    definition: >-
      Computer-aided design: software for drawing buildings, parts, and
      other objects. It is spatial but not geographic, because its drawings
      aren't tied to places on Earth.

  - term: GPS
    case_sensitive: true
    aliases: [Global Positioning System, GNSS]
    definition: >-
      The Global Positioning System: U.S. satellites that let a receiver,
      such as your phone, work out its location. GNSS is the general name
      for GPS and similar systems from other countries.

  - term: Canada Geographic Information System (CGIS)
    aliases: [Canada Geographic Information System, CGIS]
    definition: >-
      The first large GIS, built in the 1960s under Roger Tomlinson to
      inventory land across Canada.

  - term: Esri
    case_sensitive: true
    definition: >-
      The company that makes ArcGIS, founded in 1969 by Jack and Laura
      Dangermond in Redlands, California.

  - term: QGIS
    case_sensitive: true
    definition: >-
      A free and open-source desktop GIS that runs on Windows, Mac, and
      Linux.

  - term: ArcGIS Pro
    case_sensitive: true
    definition: >-
      Esri's commercial desktop GIS, for Windows.

  - term: ArcGIS Online
    case_sensitive: true
    definition: >-
      Esri's system for making and sharing maps and layers on the web.

  - term: open source
    aliases: [open-source]
    definition: >-
      Software whose source code anyone may read, change, and share, often
      free of charge. QGIS and GRASS GIS are open source.

  - term: geoprocessing
    aliases: [geoprocessing tools, geoprocessing tool]
    definition: >-
      Running a GIS tool on spatial data to make new data, such as
      buffering, clipping, or overlaying layers.

  - term: OpenStreetMap
    case_sensitive: true
    aliases: [OSM]
    definition: >-
      A free, editable map of the world built by volunteers, founded in
      2004.

  - term: GeoAI
    case_sensitive: true
    definition: >-
      Artificial intelligence applied to geographic data, for example to
      find buildings or roads in satellite images automatically.

  - term: redlining
    definition: >-
      Grading neighborhoods as risky for lending, as the federal Home
      Owners' Loan Corporation did on maps in the 1930s, which outlined many
      Black and immigrant neighborhoods in red and denied them credit.

  - term: spatial thinking
    definition: >-
      Using ideas of space, such as location, distance, pattern, and scale,
      to understand and solve problems.

  - term: GIS&T Body of Knowledge
    aliases: [Body of Knowledge]
    definition: >-
      A free collection of short, peer-reviewed articles on geographic
      information science and technology topics, from the University
      Consortium for Geographic Information Science (UCGIS).

  - term: GISP
    case_sensitive: true
    definition: >-
      Geographic Information Systems Professional: a certification from the
      GIS Certification Institute for experienced GIS practitioners.

  # --- Chapter 2: What Is Geographic Data? -----------------------------------

  - term: entity
    aliases: [entities]
    chapters: [what-is-geographic-data]
    definition: >-
      A real-world object we want to store as data, such as a tree, a
      building, or a lake. On a map, an entity is shown as a feature.

  - term: feature
    aliases: [features]
    chapters: [what-is-geographic-data]
    definition: >-
      How a map or a GIS represents an entity, usually as a point, a line,
      or a polygon, with attributes that describe it.

  - term: data abstraction
    definition: >-
      The chain of steps that turns the real world into something a computer
      can store: real world, data model, data structure, and machine code.

  - term: data structure
    aliases: [data structures]
    definition: >-
      How a data model is laid out in a computer's memory or files, for
      example as lists of coordinate pairs linked by pointers.

  - term: discrete object
    aliases: [discrete objects, discrete data, discrete]
    chapters: [what-is-geographic-data]
    definition: >-
      Something with clear boundaries that is either present or absent at a
      location, such as a road, a house, or a state.

  - term: continuous data
    aliases: [continuous, continuous surface, continuous field]
    chapters: [what-is-geographic-data]
    definition: >-
      A quantity that has a value at every location and changes gradually
      from place to place, such as elevation, temperature, or rainfall.

  - term: point
    aliases: [points]
    chapters: [what-is-geographic-data]
    definition: >-
      A vector feature with a location but no length or area, stored as a
      single x, y coordinate pair, such as a well or a school.

  - term: line
    aliases: [lines, polyline, polylines]
    chapters: [what-is-geographic-data]
    definition: >-
      A vector feature with length but no area, stored as an ordered list of
      coordinates, such as a road or a stream.

  - term: polygon
    aliases: [polygons, area feature, area features]
    definition: >-
      A vector feature that encloses an area: a closed line whose first and
      last points are the same, such as a lake, a park, or a county.

  - term: annotation
    chapters: [what-is-geographic-data]
    definition: >-
      Text placed on a map, such as place names, street names, and labels.

  - term: extent
    chapters: [what-is-geographic-data]
    definition: >-
      How far something reaches: its size, boundary, and dimensions. A
      layer's extent is the rectangle that just encloses all its features.

  - term: geometry
    chapters: [what-is-geographic-data]
    definition: >-
      The shape of a feature: a point, a line, or a polygon, stored as
      coordinates.

  - term: non-spatial data
    aliases: [non-spatial]
    definition: >-
      Data with no location of their own, such as a list of grades. When
      non-spatial data describe a spatial feature, they are its attributes.

  - term: geocoding
    definition: >-
      Turning an address or place name into coordinates, so it can be put
      on a map.

  - term: vector
    aliases: [vector data, vector model, vector data model]
    definition: >-
      A data model that stores the world as points, lines, and polygons,
      each defined by x, y coordinates and linked to its attributes. Best
      for discrete objects.

  - term: raster
    aliases: [rasters, raster data, raster model, raster data model]
    definition: >-
      A data model that stores the world as a regular grid of equal-sized
      cells, each holding one value. Best for continuous data and imagery.

  - term: TIN
    aliases: [triangulated irregular network, triangulated irregular networks]
    case_sensitive: true
    definition: >-
      Triangulated irregular network: a surface model that joins sampled
      elevation points into triangles, using more triangles where the
      ground is rough.

  - term: tabular data
    definition: >-
      Data stored in tables of rows and columns, such as the attributes of
      features.

  - term: cell
    aliases: [cells, raster cell, raster cells, pixel, pixels]
    chapters: [what-is-geographic-data]
    definition: >-
      One square in a raster grid. Each cell holds one value. In an image, a
      cell is called a pixel (picture element).

  - term: cell size
    aliases: [cell sizes]
    definition: >-
      The real-world length of one side of a raster cell, such as 30 meters.
      Smaller cells give finer resolution and larger files.

  - term: resolution
    chapters: [what-is-geographic-data]
    definition: >-
      The level of detail in data. For a raster, it is set by the cell size:
      the smaller the cells, the finer the resolution.

  - term: node
    aliases: [nodes]
    chapters: [what-is-geographic-data, osm-data-quality]
    definition: >-
      The start or end point of a line. In a network, lines meet at nodes. In
      OpenStreetMap, a node is any single point with a latitude and
      longitude, standing alone or as a vertex of a way.

  - term: vertex
    aliases: [vertices]
    definition: >-
      An intermediate point where a line or polygon boundary changes
      direction.

  - term: line segment
    aliases: [line segments]
    definition: >-
      The straight piece of a line between two vertices or nodes.

  - term: arc
    aliases: [arcs]
    chapters: [what-is-geographic-data]
    definition: >-
      A line stored as an ordered list of coordinates. Polygons can be built
      from arcs that share their end points.

  - term: pointer
    aliases: [pointers]
    chapters: [what-is-geographic-data]
    definition: >-
      In a data structure, a stored address that tells the computer where
      the next piece of data, such as the next arc, is found.

  - term: topology
    definition: >-
      The recorded connections between features, such as which polygons
      share an edge and which lines meet at a node. It keeps neighbors from
      having gaps or overlaps.

  - term: northing
    aliases: [northings]
    definition: >-
      A distance north from a starting line: the y coordinate in a projected
      coordinate system.

  - term: easting
    aliases: [eastings]
    definition: >-
      A distance east from a starting line: the x coordinate in a projected
      coordinate system.

  - term: shapefile
    aliases: [shapefiles]
    definition: >-
      A common vector format from Esri that stores one layer in several files
      with the same name: .shp (geometry), .shx (index), and .dbf
      (attributes) are required, and .prj holds the coordinate system.

  - term: GeoPackage
    aliases: [GeoPackages]
    definition: >-
      An open file format (.gpkg) from the Open Geospatial Consortium that
      stores many vector and raster layers in a single file. It is QGIS's
      default format.

  - term: map algebra
    definition: >-
      Math on rasters, cell by cell, such as adding two grids or finding
      every cell where slope is under 10 percent.

  - term: rasterize
    aliases: [rasterizing, rasterization]
    definition: >-
      To convert vector data into a raster.

  - term: vectorize
    aliases: [vectorizing, vectorization]
    definition: >-
      To convert a raster into vector features.

  - term: Landsat
    definition: >-
      A series of U.S. Earth-observing satellites, run by NASA and the USGS,
      that have imaged the whole planet since 1972, mostly with 30-meter
      cells.

  # --- Chapter 3: Location and Coordinate Systems -------------------------------

  - term: relative location
    aliases: [relative locations]
    definition: >-
      A description of where something is in relation to a landmark, such as
      "ten paces north of the oak." It only works if you know the landmark.

  - term: absolute location
    aliases: [absolute locations]
    definition: >-
      A location given in a coordinate system that means the same thing to
      everyone, such as 38° 53′ 52″ N, 77° 02′ 11″ W.

  - term: geodesy
    aliases: [geodesists, geodetic]
    definition: >-
      The science of measuring the Earth's size, shape, orientation in space,
      and gravity field.

  - term: ellipsoid
    aliases: [ellipsoids, spheroid, oblate spheroid, ellipsoid of revolution]
    definition: >-
      A smooth mathematical model of the Earth's shape: an ellipse rotated
      about its polar axis, wider at the equator than from pole to pole.
      Examples are Clarke 1866, GRS 80, and WGS 84.

  - term: semi-major axis
    definition: >-
      The equatorial radius of an ellipsoid, written *a*. For the Earth,
      about 6,378 km.

  - term: semi-minor axis
    definition: >-
      The polar radius of an ellipsoid, written *b*. For the Earth, about
      6,357 km.

  - term: flattening
    chapters: [location-and-coordinates]
    definition: >-
      How squashed an ellipsoid is: *f* = (*a* − *b*) / *a*. For the Earth,
      about 1/298.

  - term: geoid
    aliases: [geoids]
    definition: >-
      The surface of equal gravity that best matches global mean sea level.
      It is lumpy, up to about 100 m above or below the ellipsoid, and
      elevations are measured from it.

  - term: mean sea level
    definition: >-
      The average height of the sea surface over many years, which the geoid
      approximates.

  - term: ellipsoid height
    aliases: [ellipsoid heights]
    definition: >-
      Height above the ellipsoid, written *h*. This is the height a GPS
      receiver measures.

  - term: orthometric height
    aliases: [orthometric heights]
    definition: >-
      Height above the geoid, written *H*: the elevation, or "height above
      sea level," printed on maps. *h* = *H* + *N*.

  - term: geoid height
    aliases: [geoid heights, geoid undulation]
    definition: >-
      The distance from the ellipsoid to the geoid at a place, written *N*.
      In the lower 48 United States it is negative, about −30 m.

  - term: geodetic datum
    aliases: [datum, datums, geodetic datums]
    definition: >-
      A model that fixes an ellipsoid's size, shape, and position relative to
      the Earth, realized by a network of control points, so latitude and
      longitude point to real places. Examples are NAD27, NAD83, and WGS84.

  - term: control point
    aliases: [control points, benchmark, benchmarks, survey marker, survey markers]
    definition: >-
      A point on the ground, often marked with a bronze disk, whose
      coordinates have been measured precisely. Control points tie a datum to
      the Earth.

  - term: triangulation
    definition: >-
      An old surveying method that measures the angles of a chain of
      triangles between stations to work out their positions across a large
      area.

  - term: NAD27
    aliases: [North American Datum of 1927]
    definition: >-
      The North American Datum of 1927. It used the Clarke 1866 ellipsoid and
      an origin at Meades Ranch, Kansas.

  - term: NAD83
    aliases: [North American Datum of 1983, "NAD83(2011)"]
    definition: >-
      The North American Datum of 1983, an earth-centered datum on the GRS 80
      ellipsoid, fixed to the North American plate. The datum of most U.S.
      government GIS data.

  - term: WGS84
    aliases: [WGS 84, World Geodetic System 1984]
    definition: >-
      The World Geodetic System of 1984, the global, earth-centered datum
      used by GPS. It differs from NAD83 by about 1 to 2 meters in North
      America.

  - term: Continuously Operating Reference Stations (CORS)
    aliases: [CORS, Continuously Operating Reference Stations]
    definition: >-
      A network of permanent GPS receivers, run by the National Geodetic
      Survey and its partners, that keeps NAD83 up to date.

  - term: NATRF2022
    definition: >-
      The North American Terrestrial Reference Frame of 2022, the new datum
      that will replace NAD83 in the United States.

  - term: datum shift
    aliases: [datum shifts]
    definition: >-
      The difference in where the same latitude and longitude land on the
      ground in two different datums. Between NAD27 and NAD83 it can exceed
      100 m.

  - term: datum transformation
    aliases: [datum transformations, geographic transformation, geographic transformations]
    definition: >-
      Equations or a grid of measured shifts that convert coordinates from
      one datum to another.

  - term: latitude
    aliases: [latitudes]
    definition: >-
      The angle north or south of the equator, from 0° at the equator to 90°
      at the poles.

  - term: longitude
    aliases: [longitudes]
    definition: >-
      The angle east or west of the prime meridian, from 0° at Greenwich to
      180° east or west.

  - term: equator
    case_sensitive: false
    definition: >-
      The parallel halfway between the poles, at 0° latitude. It is the only
      parallel that is a great circle.

  - term: prime meridian
    definition: >-
      The meridian at 0° longitude, through Greenwich, England, chosen in
      1884. Longitude is measured east and west from it.

  - term: parallel
    aliases: [parallels]
    chapters: [location-and-coordinates, map-projections]
    definition: >-
      A line of equal latitude. Parallels run east and west and get shorter
      toward the poles.

  - term: meridian
    aliases: [meridians]
    definition: >-
      A line of equal longitude. Meridians run from pole to pole and meet at
      the poles.

  - term: decimal degrees (DD)
    aliases: [decimal degrees, decimal degree]
    definition: >-
      Latitude or longitude written as one signed number, such as −79.0558.
      Negative numbers are south latitudes and west longitudes.

  - term: degrees, minutes, and seconds (DMS)
    aliases: ["degrees, minutes, and seconds", degrees-minutes-seconds, "degrees, minutes, seconds", DMS]
    definition: >-
      Latitude or longitude written in degrees, minutes (1/60 of a degree),
      and seconds (1/3,600 of a degree), with a hemisphere letter, such as
      79° 03′ 21″ W.

  - term: great circle
    aliases: [great circles, great-circle]
    definition: >-
      A circle on a sphere whose plane passes through the center. The
      shortest route between two points follows a great circle.

  - term: graticule
    aliases: [graticules]
    definition: >-
      The network of parallels and meridians drawn on a map.

  - term: Plate Carrée
    aliases: [Plate Carree, equirectangular projection, equirectangular]
    definition: >-
      The projection that plots longitude as *x* and latitude as *y* on an
      even grid. It stretches the map east to west toward the poles.

  - term: geographic coordinate system (GCS)
    aliases: [geographic coordinate system, geographic coordinate systems, GCS]
    definition: >-
      A coordinate system that gives positions as latitude and longitude, in
      degrees, on a datum. EPSG:4326 (WGS84) and 4269 (NAD83) are examples.

  # --- Chapter 4: Map Projections ----------------------------------------------

  - term: conformal
    aliases: [conformal projection, conformal projections]
    definition: >-
      A projection that keeps local angles true, so small shapes look right.
      Mercator and Lambert Conformal Conic are conformal.

  - term: equal-area
    aliases: [equal-area projection, equal-area projections, equal area, equivalent projection]
    definition: >-
      A projection that keeps relative area true. Use one to measure or
      compare areas, or to map density.

  - term: equidistant
    aliases: [equidistant projection, equidistant projections]
    definition: >-
      A projection that keeps true distance from one or two points, or along
      certain lines.

  - term: azimuthal
    aliases: [azimuthal projection, azimuthal projections, planar projection]
    definition: >-
      A projection onto a plane that keeps true directions from its center
      point.

  - term: compromise projection
    aliases: [compromise projections, compromise]
    chapters: [map-projections]
    definition: >-
      A projection that preserves no property exactly but keeps every
      distortion moderate, such as Robinson or Winkel Tripel.

  - term: Tissot's indicatrix
    aliases: [Tissot indicatrix, Tissot's circles]
    definition: >-
      Identical small circles drawn on the globe and then projected. Their
      size and shape on the map show the projection's distortion.

  - term: Mercator
    aliases: [Mercator projection]
    definition: >-
      A conformal cylindrical projection from 1569, made for navigation:
      lines of constant compass bearing are straight. It greatly enlarges
      areas toward the poles.

  - term: Web Mercator
    aliases: [Pseudo-Mercator, EPSG:3857]
    definition: >-
      The Mercator variant used by nearly every web map (EPSG:3857). Good for
      display, never for measuring distance or area.

  - term: rhumb line
    aliases: [rhumb lines]
    definition: >-
      A line of constant compass bearing. It is straight on a Mercator map.

  - term: developable surface
    aliases: [developable surfaces]
    definition: >-
      A shape that can be unrolled flat without stretching: a plane, a
      cylinder, or a cone.

  - term: tangent
    chapters: [map-projections]
    definition: >-
      A projection surface that touches the Earth along one line or at one
      point.

  - term: secant
    definition: >-
      A projection surface that cuts through the Earth along two lines (or a
      circle), spreading the error more evenly.

  - term: standard line
    aliases: [standard lines, standard parallel, standard parallels, standard point]
    definition: >-
      A line where the projection surface meets the Earth, so the scale is
      exact. Standard lines that follow latitude are standard parallels.

  - term: scale factor
    definition: >-
      The ratio of scale at a place on a map to the map's stated scale:
      exactly 1 on a standard line, below 1 where the map shrinks the Earth,
      above 1 where it stretches it.

  - term: Lambert Conformal Conic
    definition: >-
      A conformal conic projection with two standard parallels. It suits
      mid-latitude regions that run east to west, and is used for North
      Carolina State Plane.

  - term: Albers Equal-Area Conic
    aliases: [Albers, Conus Albers]
    definition: >-
      An equal-area conic projection, the standard for measuring areas across
      the contiguous United States (EPSG:5070).

  - term: Transverse Mercator
    definition: >-
      A Mercator projection turned on its side, so the cylinder touches the
      Earth along a central meridian. It suits regions that run north to
      south.

  - term: central meridian
    definition: >-
      The meridian at the center of a projection or zone, such as the line
      along which a Transverse Mercator cylinder touches the Earth.

  - term: Universal Transverse Mercator (UTM)
    aliases: [UTM, Universal Transverse Mercator]
    definition: >-
      A system of 60 zones, each 6° of longitude wide, each a secant
      Transverse Mercator projection in meters. North Carolina spans zones
      17N and 18N.

  - term: false easting
    definition: >-
      A value added to every *x* coordinate so that none are negative, such
      as 500,000 m in UTM.

  - term: State Plane Coordinate System (SPCS)
    aliases: [State Plane, State Plane Coordinate System, SPCS, NC State Plane, North Carolina State Plane]
    definition: >-
      A U.S. system of about 120 zones following state and county lines,
      built for surveyors, with error held to 1 part in 10,000. North
      Carolina has one zone (EPSG:32119 in meters, 2264 in feet).

  - term: coordinate reference system (CRS)
    aliases: [coordinate reference system, coordinate reference systems, CRS]
    definition: >-
      The full description of how coordinates relate to the Earth: a datum,
      plus a projection with its parameters, plus units.

  - term: projected coordinate system
    aliases: [projected coordinate systems, projected CRS]
    definition: >-
      A coordinate system that gives positions as *x, y* in meters or feet,
      on a map projection built on a datum, such as UTM or State Plane.

  - term: EPSG code
    aliases: [EPSG codes, EPSG]
    definition: >-
      A number that identifies a coordinate reference system in the EPSG
      registry, such as 4326 for WGS84 or 32119 for North Carolina State
      Plane.

  - term: gnomonic projection
    aliases: [gnomonic]
    definition: >-
      An azimuthal projection on which every great circle is a straight line.

  - term: on-the-fly reprojection
    aliases: [reprojects layers on the fly]
    definition: >-
      Reprojecting layers as they are drawn, so layers in different CRSs line
      up on the map without changing their stored coordinates.

  - term: reproject
    aliases: [reprojecting, reprojected, reprojection, Reproject Layer]
    definition: >-
      To convert a layer's coordinates from one CRS to another and save the
      result. Defining a projection, by contrast, only labels what the
      coordinates already are.

  # --- Chapter 5: Attribute Data and Queries --------------------------------------

  - term: record
    aliases: [records]
    chapters: [attribute-queries]
    definition: >-
      A row in an attribute table: everything known about one feature.

  - term: field
    aliases: [fields]
    chapters: [attribute-queries]
    definition: >-
      A column in an attribute table: one attribute, measured the same way
      for every feature. Also called an attribute or item.

  - term: data type
    aliases: [data types, field type, field types]
    definition: >-
      How a field is stored, such as text, integer, double, or date. It
      limits what the field can hold.

  - term: precision
    chapters: [attribute-queries]
    definition: >-
      For a numeric field, the total number of digits it can hold. Scale is
      how many of them fall after the decimal point.

  - term: bit
    aliases: [bits]
    definition: >-
      A binary digit, 0 or 1. With *n* bits you can write 2ⁿ different
      values.

  - term: binary
    chapters: [attribute-queries]
    definition: >-
      Base-2 numbers, written with only 0 and 1, in which each column is worth
      twice the one to its right. Computers store all data in binary.

  - term: integer
    aliases: [integers, Short Integer, Long Integer, Big Integer]
    definition: >-
      A data type for whole numbers. Its range depends on its bits: up to
      32,767 for 16 bits, about 2.1 billion for 32 bits.

  - term: Double
    aliases: [double-precision]
    case_sensitive: true
    definition: >-
      A 64-bit data type for decimal numbers, with about 15 significant
      digits. Float is the 32-bit version, with about 7.

  - term: level of measurement
    aliases: [levels of measurement, scale of measurement, scales of measurement, measurement scale]
    definition: >-
      What kind of values an attribute holds, which decides what questions
      make sense: nominal, ordinal, interval, or ratio.

  - term: nominal
    definition: >-
      Categories with no order, such as land use or a name. You can test
      equality and count, but not average.

  - term: ordinal
    definition: >-
      Ranked categories whose steps are of unknown size, such as A, B, C, D
      or a hurricane's category.

  - term: interval
    chapters: [attribute-queries]
    definition: >-
      Values with equal steps but an arbitrary zero, such as temperature in
      °C or a calendar year. Differences make sense; ratios don't.

  - term: ratio
    chapters: [attribute-queries]
    definition: >-
      Values with equal steps and a true zero, such as population or area.
      Every arithmetic operation makes sense.

  - term: query
    aliases: [queries, attribute query, attribute queries]
    chapters: [attribute-queries]
    definition: >-
      A written condition that the software tests against every record,
      selecting those that pass.

  - term: SQL
    aliases: [Structured Query Language]
    definition: >-
      Structured Query Language, the standard language for asking databases
      questions. In a GIS you usually write only its WHERE clause.

  - term: WHERE clause
    aliases: [WHERE clauses]
    definition: >-
      The condition part of an SQL query, such as `"Area" > 20`. It is the
      part you write in Select by Expression or Select By Attributes.

  - term: selection
    aliases: [selected set, selections]
    chapters: [attribute-queries]
    definition: >-
      The records, and their features, that pass a query. A selection is
      temporary until you export it or calculate it into a field.

  - term: intersection
    chapters: [attribute-queries]
    definition: >-
      The records in both of two sets. AND selects the intersection.

  - term: union
    chapters: [attribute-queries]
    definition: >-
      The records in either of two sets. OR selects the union.

  - term: complement
    chapters: [attribute-queries]
    definition: >-
      Every record outside a set. NOT selects the complement.

  - term: Venn diagram
    aliases: [Venn diagrams]
    definition: >-
      A drawing of sets as overlapping circles, useful for checking what an
      AND or OR query will select.

  - term: De Morgan's law
    aliases: [De Morgan's laws]
    definition: >-
      NOT (A AND B) equals (NOT A) OR (NOT B), and NOT (A OR B) equals (NOT A)
      AND (NOT B).

  - term: NULL
    case_sensitive: true
    definition: >-
      A missing value: nothing was recorded. NULL fails every comparison, so
      test for it with IS NULL.

  - term: field calculator
    aliases: [Field Calculator, Calculate Field]
    definition: >-
      A tool that computes values and writes them into a field, for every
      record or for the selected records only.

  - term: definition query
    aliases: [definition queries]
    definition: >-
      In ArcGIS Pro, a WHERE clause that hides the features that fail it,
      until you remove it. QGIS calls this a filter.

  # Chapter 6: Databases and Table Joins

  - term: database management system (DBMS)
    aliases: [database management system, database management systems, DBMS]
    definition: >-
      Software that stores data once and lets many programs and people query
      and edit it, while it controls who may change what.

  - term: database
    aliases: [databases]
    definition: >-
      An organized collection of tables, usually stored and managed by a
      database management system.

  - term: relational database
    aliases: [relational databases]
    definition: >-
      A database that stores data in tables and links them through key fields
      that hold the same values.

  - term: client/server
    definition: >-
      A design in which client programs send requests to a server, which does
      the work and sends back the answer.

  - term: concurrency
    definition: >-
      Many users reading and editing a database at the same time, without
      overwriting each other's changes.

  - term: PostGIS
    definition: >-
      A free extension that adds geometry types and spatial functions to the
      PostgreSQL database.

  - term: SQLite
    definition: >-
      A small database that lives in a single file. GeoPackages are SQLite
      databases.

  - term: key
    aliases: [keys, key field, key fields]
    chapters: [database-joins, spatial-joins, census-data]
    definition: >-
      A field whose values link the records of one table to the records of
      another.

  - term: primary key
    aliases: [primary keys]
    definition: >-
      A field whose values identify each row of a table uniquely. No value may
      repeat or be missing.

  - term: foreign key
    aliases: [foreign keys]
    definition: >-
      A field that holds values of another table's primary key. Its values can
      repeat.

  - term: FIPS code
    aliases: [FIPS codes, FIPS]
    definition: >-
      A numeric code the U.S. government assigns to each state, county, and
      other area, such as 37 for North Carolina and 37135 for Orange County.

  - term: GEOID
    aliases: [GEOIDs]
    case_sensitive: true
    definition: >-
      The Census Bureau's identifier for a geographic area, made by stringing
      FIPS codes together. A tract GEOID has 11 characters.

  - term: table join
    aliases: [table joins, attribute join, attribute joins, join, joins, joined, joining]
    chapters: [database-joins, census-data]
    definition: >-
      Appending the fields of a source table to a destination table by
      matching the values of a key field.

  - term: destination table
    aliases: [destination tables, destination layer, target table]
    definition: >-
      In a join, the table that receives the new fields. All of its records
      are kept.

  - term: source table
    aliases: [source tables, source layer, join table]
    definition: >-
      In a join, the table whose fields are appended to the destination.

  - term: bag
    aliases: [bags, multiset]
    chapters: [database-joins]
    definition: >-
      A collection that can contain duplicates. A table is a bag unless a
      primary key forbids repeated rows.

  - term: inner join
    aliases: [inner joins]
    definition: >-
      A join that keeps only the records that match in both tables.

  - term: left join
    aliases: [left joins, left outer join]
    definition: >-
      A join that keeps every record of the left (destination) table, with
      NULL where nothing matched. The default in QGIS and ArcGIS Pro.

  - term: right join
    aliases: [right joins, right outer join]
    definition: >-
      A join that keeps every record of the right (source) table.

  - term: full outer join
    aliases: [full outer joins]
    definition: >-
      A join that keeps every record of both tables.

  - term: cardinality
    definition: >-
      How many records in one table match each record in another: one-to-one,
      many-to-one, one-to-many, or many-to-many.

  - term: one-to-one
    aliases: ["1:1"]
    definition: >-
      Each destination record matches exactly one source record, and the other
      way around.

  - term: many-to-one
    aliases: ["M:1"]
    definition: >-
      Many destination records match the same source record, but each matches
      only one. A simple join works.

  - term: one-to-many
    aliases: ["1:M"]
    definition: >-
      One destination record matches many source records. Summarize the source
      first, or use a relate.

  - term: many-to-many
    aliases: ["M:M"]
    definition: >-
      Records on each side match many records on the other. Needs a linking
      table.

  - term: relate
    aliases: [relates, relation, relations]
    chapters: [database-joins]
    definition: >-
      A link between two tables that lets you see the matching records without
      copying fields into the layer. QGIS calls it a relation.

  - term: linking table
    aliases: [linking tables, junction table]
    definition: >-
      A table with one row for each pair of related records, used to handle a
      many-to-many relationship.

  - term: CSV
    aliases: [CSV file, CSV files, CSVs, comma-separated values]
    definition: >-
      A plain-text table in which values are separated by commas, one record
      per line.

  - term: .csvt file
    aliases: [.csvt, csvt]
    definition: >-
      A one-line file next to a CSV that sets the data type of each column for
      QGIS and GDAL, such as "String","Integer".

  - term: TIGER/Line
    aliases: [TIGER/Line shapefiles]
    definition: >-
      The Census Bureau's boundary files for states, counties, tracts, roads,
      and other features.

  # Chapter 7: Spatial Joins

  - term: spatial join
    aliases: [spatial joins]
    definition: >-
      A join that matches the features of two layers by location instead of
      by a shared key, then appends attributes from one to the other.

  - term: inside join
    aliases: [inside joins]
    definition: >-
      A spatial join that matches features that contain, lie within, or
      intersect each other, such as points inside polygons.

  - term: distance join
    aliases: [distance joins]
    definition: >-
      A spatial join that matches each feature to the closest feature, or to
      every feature within a set distance, and can record the distance.

  - term: simple join
    aliases: [simple joins, simple spatial join]
    definition: >-
      A join that copies the attributes of one source feature to each
      destination feature. Works for one-to-one and many-to-one relationships.

  - term: summarized join
    aliases: [summarized joins, summarized spatial join]
    definition: >-
      A join that counts and summarizes all the source features matching each
      destination feature (count, sum, mean, minimum, maximum).

  - term: spatial predicate
    aliases: [spatial predicates, geometric predicate, geometric predicates, predicate, predicates, match option, match options]
    definition: >-
      A rule that tests a spatial relationship between two geometries, such
      as intersects, contains, within, or touches.

  - term: nearest neighbor
    aliases: [nearest neighbors]
    definition: >-
      The feature closest to a given feature.

  - term: Join_Count
    case_sensitive: true
    definition: >-
      The field ArcGIS Pro's Spatial Join adds to hold the number of join
      features that matched each target feature.

  - term: merge rule
    aliases: [merge rules]
    definition: >-
      In ArcGIS Pro, how the values of several matching features are combined
      into one, such as first, sum, or mean.

  - term: ray casting
    aliases: [ray-casting]
    definition: >-
      A point-in-polygon test that counts how often a line from the point
      crosses the polygon's edge. An odd count means inside.

  - term: Thiessen polygons
    aliases: [Thiessen polygon, Voronoi polygons]
    definition: >-
      Polygons that surround each point with all the area closer to it than to
      any other point.

  - term: geodesic distance
    aliases: [geodesic distances, geodesic]
    definition: >-
      Distance measured along the curved surface of the ellipsoid, rather than
      on a flat projected map.

  # Chapter 8: Census Data

  - term: authoritative data
    definition: >-
      Data from official agencies, collected under documented standards and
      published with metadata.

  - term: asserted data
    definition: >-
      Data contributed by the public, such as OpenStreetMap. Their accuracy is
      undocumented and uneven.

  - term: demographic data
    definition: >-
      Data on who lives in a place: counts of people and households, and their
      age, sex, race and ethnicity, and household type.

  - term: socioeconomic data
    definition: >-
      Data on economic and social conditions, such as income, education,
      employment, poverty, and housing costs.

  - term: deprivation index
    aliases: [deprivation indices]
    definition: >-
      A single score that combines several socioeconomic variables to measure
      how disadvantaged an area is.

  - term: decennial census
    definition: >-
      The full count of every U.S. resident, taken every ten years as the
      Constitution requires.

  - term: American Community Survey (ACS)
    aliases: [American Community Survey, ACS]
    definition: >-
      The Census Bureau's yearly sample survey of about 3.5 million addresses,
      the main source of social, economic, and housing data.

  - term: Economic Census
    definition: >-
      The Census Bureau's survey of businesses, taken every five years in
      years ending in 2 and 7.

  - term: apportionment
    definition: >-
      Dividing the 435 seats in the U.S. House of Representatives among the
      states, by population.

  - term: redistricting
    definition: >-
      Redrawing the boundaries of congressional and legislative districts
      after each census.

  - term: Post-Enumeration Survey
    definition: >-
      A survey taken after the census to measure how many people it missed or
      counted twice.

  - term: differential privacy
    definition: >-
      A method that adds calibrated statistical noise to published tables, so
      that individuals cannot be identified.

  - term: census geography
    definition: >-
      The hierarchy of areas for which census data are published, from the
      nation down to the block.

  - term: spine
    aliases: [geographic spine]
    chapters: [census-data]
    definition: >-
      The main line of census geography (nation, regions, divisions, states,
      counties, tracts, block groups, blocks), in which each level nests in
      the one above.

  - term: census tract
    aliases: [census tracts, tract, tracts]
    definition: >-
      A relatively permanent subdivision of a county with 1,200 to 8,000
      people, about 4,000 on average.

  - term: block group
    aliases: [block groups]
    definition: >-
      A cluster of census blocks within a tract, usually with 600 to 3,000
      people. The smallest area with ACS estimates.

  - term: census block
    aliases: [census blocks, block, blocks]
    chapters: [census-data]
    definition: >-
      The smallest census area, bounded by streets, streams, and other visible
      features. Decennial counts only.

  - term: ZIP Code Tabulation Area (ZCTA)
    aliases: [ZIP Code Tabulation Area, ZIP Code Tabulation Areas, ZCTA, ZCTAs]
    definition: >-
      An approximation of a ZIP Code's area built from census blocks.

  - term: census-designated place
    aliases: [census-designated places]
    definition: >-
      An unincorporated community that the Census Bureau defines so that it
      can publish statistics for it.

  - term: margin of error (MOE)
    aliases: [margin of error, margins of error, MOE, MOEs]
    definition: >-
      The likely range of sampling error around an estimate. Census Bureau
      margins of error use a 90 percent confidence level.

  - term: confidence level
    definition: >-
      How often a range built the same way would contain the true value, if
      the survey were repeated many times.

  - term: coefficient of variation (CV)
    aliases: [coefficient of variation, CV]
    definition: >-
      The standard error as a percentage of the estimate. Over about 40
      percent, an ACS estimate is usually treated as unreliable.

  - term: ACS 1-year estimates
    aliases: [1-year estimates, 1-year estimate]
    definition: >-
      ACS estimates from 12 months of data, published only for areas with
      65,000 or more people.

  - term: ACS 5-year estimates
    aliases: [5-year estimates, 5-year estimate]
    definition: >-
      ACS estimates from 60 months of data, published for every area down to
      block groups.

  - term: cartographic boundary files
    definition: >-
      Simplified census boundaries clipped to the shoreline, for small-scale
      maps.

  # Chapter 9: Geocoding and Georeferencing

  - term: address matching
    definition: >-
      Geocoding an address by comparing it with a reference file whose
      features already carry address information.

  - term: reference file
    aliases: [reference files, reference data]
    chapters: [geocoding-georeferencing]
    definition: >-
      In geocoding, the layer that addresses are matched against, such as
      parcels, street centerlines, or ZIP Code areas.

  - term: ZIP+4
    definition: >-
      A nine-digit ZIP Code whose last four digits identify a short segment of
      a mail route, such as one side of a block.

  - term: street centerline
    aliases: [street centerlines, centerline, centerlines]
    definition: >-
      A line along the middle of a street. Centerline files used for
      geocoding store the address range on each side of each segment.

  - term: address range
    aliases: [address ranges]
    definition: >-
      The lowest and highest house numbers on one side of a street segment.

  - term: linear interpolation
    definition: >-
      Estimating a position between two known points in proportion to a value
      between their values, such as a house number within a range.

  - term: centroid
    aliases: [centroids]
    definition: >-
      The center point of a polygon.

  - term: parcel
    aliases: [parcels]
    definition: >-
      A polygon for one piece of property, usually with its owner and address.

  - term: address point
    aliases: [address points]
    definition: >-
      A point for one address, often placed on the rooftop or the building
      entrance.

  - term: match score
    aliases: [match scores]
    definition: >-
      How closely an address agrees with a candidate in the reference file,
      often on a scale from 0 to 100.

  - term: match rate
    aliases: [match rates]
    definition: >-
      The share of addresses in a table that were successfully geocoded.

  - term: batch geocoding
    aliases: [batch mode]
    definition: >-
      Geocoding a whole table of addresses in one run.

  - term: geomasking
    definition: >-
      Moving geocoded points by a small random amount to protect the privacy of
      the people they represent.

  - term: georeferencing
    aliases: [georeference, georeferenced]
    definition: >-
      Transforming a raster, such as a scanned map or image, from file
      coordinates to map coordinates.

  - term: file coordinates
    definition: >-
      Positions in a raster given as pixel columns and rows.

  - term: image rectification
    aliases: [rectification, rectify, rectified]
    definition: >-
      Correcting an image's geometry so that it fits a map coordinate system.

  - term: ground control point (GCP)
    aliases: [ground control point, ground control points, GCP, GCPs]
    definition: >-
      A feature that can be found on both an image and a reference layer, used
      to work out the transformation between them.

  - term: transformation
    aliases: [transformations]
    chapters: [geocoding-georeferencing]
    definition: >-
      Equations that convert image coordinates into map coordinates, with
      coefficients solved from ground control points.

  - term: affine transformation
    aliases: [affine, first-order transformation]
    definition: >-
      A six-coefficient transformation that corrects translation, scale, skew,
      and rotation. Needs at least 3 GCPs.

  - term: polynomial transformation
    aliases: [higher-order polynomial, higher-order polynomials]
    definition: >-
      A transformation that can bend an image. Second order needs at least 6
      GCPs; third order needs 10.

  - term: least squares
    definition: >-
      Fitting a model by choosing the coefficients that make the sum of the
      squared errors as small as possible.

  - term: resampling
    definition: >-
      Giving each cell of a transformed raster a value from the input cells:
      nearest neighbor, bilinear, or cubic convolution.

  - term: bilinear interpolation
    aliases: [bilinear]
    definition: >-
      Resampling that averages the four nearest input cells, weighted by
      distance.

  - term: cubic convolution
    definition: >-
      Resampling that uses the 16 nearest input cells.

  - term: residual
    aliases: [residuals]
    definition: >-
      The difference between an observed value and the value a model
      predicts; in georeferencing, the distance between a GCP's true and
      transformed positions.

  - term: root mean square error (RMSE)
    aliases: [root mean square error, RMSE, RMS error]
    definition: >-
      The square root of the average squared residual: one number that sums
      up how well a model fits.

  - term: check point
    aliases: [check points]
    definition: >-
      A point with known coordinates that is not used to fit a transformation,
      kept back to test its accuracy.

  # Chapter 10: OpenStreetMap and data quality

  - term: volunteered geographic information
    aliases: [VGI]
    definition: >-
      Geographic data created by individuals, most of them not trained in
      mapping, and shared on the internet (Goodchild 2007). OpenStreetMap is
      the best-known example.

  - term: spatial data quality
    aliases: [data quality]
    definition: >-
      How well a geographic dataset fits its intended use, described by
      elements such as lineage, accuracy, consistency, and completeness.

  - term: lineage
    chapters: [osm-data-quality]
    definition: >-
      The history of a dataset: where the data came from, and how they have
      been collected, processed, and edited since.

  - term: positional accuracy
    definition: >-
      How close the coordinates in a dataset are to the true positions of
      the features.

  - term: attribute accuracy
    definition: >-
      How correct the non-spatial values in a dataset are, such as a
      feature's type or name.

  - term: logical consistency
    definition: >-
      Whether data agree with their own rules, for example polygons that
      close and roads that meet at intersections.

  - term: completeness
    chapters: [osm-data-quality]
    definition: >-
      An element of data quality: what is missing from a dataset, and what
      is there that shouldn't be.

  - term: temporal quality
    definition: >-
      How current a dataset is, and how accurate its dates are.

  - term: ISO 19157
    case_sensitive: true
    definition: >-
      The international standard for describing and measuring the quality
      of geographic data.

  - term: Big Data
    definition: >-
      Datasets too large, too fast, or too varied for traditional tools,
      often described by three Vs: volume, velocity, and variety.

  - term: veracity
    definition: >-
      Whether data can be trusted; sometimes called the fourth V of Big
      Data.

  - term: FAIR principles
    aliases: [FAIR]
    case_sensitive: true
    definition: >-
      Guidelines saying that good data should be Findable, Accessible,
      Interoperable, and Reusable (Wilkinson et al. 2016).

  - term: Open Database License
    aliases: [ODbL]
    definition: >-
      The license for OpenStreetMap data. Anyone may use and share the data
      if they credit OpenStreetMap contributors and share derived databases
      under the same license.

  - term: changeset
    aliases: [changesets]
    definition: >-
      A group of edits to OpenStreetMap saved together, with the editor's
      username and a comment.

  - term: closed way
    aliases: [closed ways]
    definition: >-
      In OpenStreetMap, a way (an ordered list of nodes) whose first and last
      nodes are the same, forming an area such as a building.

  - term: tag
    aliases: [tags]
    chapters: [osm-data-quality]
    definition: >-
      In OpenStreetMap, a key=value pair that describes an element, such as
      highway=residential.

  - term: Overture Maps Foundation
    definition: >-
      A group founded in 2022 by Amazon, Meta, Microsoft, and TomTom to build
      open map data, partly from OpenStreetMap.

  - term: extrinsic quality assessment
    aliases: [extrinsic, extrinsic measures]
    chapters: [osm-data-quality]
    definition: >-
      Measuring the quality of a dataset by comparing it with an
      authoritative reference dataset.

  - term: intrinsic quality assessment
    aliases: [intrinsic, intrinsic measures]
    chapters: [osm-data-quality]
    definition: >-
      Measuring the quality of OpenStreetMap from its own editing history,
      such as the number of editors and versions in an area.

  - term: Linus's Law
    aliases: ["Linus' Law"]
    definition: >-
      "Given enough eyeballs, all bugs are shallow." Applied to maps, areas
      edited by more contributors tend to be more accurate.

  - term: Osmose
    case_sensitive: true
    definition: >-
      A tool that runs automated quality checks on OpenStreetMap data.

  - term: OSMCha
    case_sensitive: true
    definition: >-
      OSM Changeset Analyzer, a tool for reviewing recent OpenStreetMap edits
      to catch mistakes and vandalism.

  - term: MapRoulette
    case_sensitive: true
    definition: >-
      A tool that turns detected OpenStreetMap errors into small tasks that
      volunteers can fix.

  - term: crisis mapping
    definition: >-
      Mapping by volunteers to support the response to a disaster or other
      crisis.

  - term: Humanitarian OpenStreetMap Team
    aliases: [HOT]
    case_sensitive: true
    definition: >-
      An organization that coordinates volunteer OpenStreetMap mapping for
      disaster response and development.

  - term: Tasking Manager
    aliases: [HOT Tasking Manager]
    case_sensitive: true
    definition: >-
      HOT's tool that divides a mapping project into small squares, so that
      volunteers don't overlap and each square can be validated.

  - term: validation
    aliases: [validator, validators, validates, validated]
    chapters: [osm-data-quality]
    definition: >-
      In the HOT Tasking Manager, a check of a finished square by a second,
      experienced mapper.

  - term: mapathon
    aliases: [mapathons]
    definition: >-
      An event where volunteers map together for a few hours, often for a
      humanitarian project.

  - term: Missing Maps
    case_sensitive: true
    definition: >-
      A project founded in 2014 that maps vulnerable places before disasters
      happen.

  - term: iD
    case_sensitive: true
    chapters: [osm-data-quality]
    definition: >-
      OpenStreetMap's web-based editor, which runs in a browser with no
      installation.

  - term: JOSM
    case_sensitive: true
    definition: >-
      The Java OpenStreetMap editor, a desktop editor for advanced work.
